name: build-iso

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # attach ISOs to a release on tag pushes
  pages: write      # publish the [gameos] pacman repo to GitHub Pages
  id-token: write   # actions/deploy-pages OIDC

# Don't run two Pages deploys concurrently — github-pages env enforces it
# anyway, but this skips the queueing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bump pkgrel to the CI run number
        # The PKGBUILDs ship with pkgrel=1 so a local `./build.sh` keeps
        # producing a sane (and stable) 0.1.0-1. In CI we want each push
        # to publish a *strictly newer* version than the previous, or
        # pacman -Syu on an installed system sees nothing to upgrade.
        # GITHUB_RUN_NUMBER is monotonic per workflow per repo, exactly
        # what pkgrel wants.
        run: |
          set -euo pipefail
          for pb in packages/*/PKGBUILD; do
              sed -i "s/^pkgrel=.*/pkgrel=${GITHUB_RUN_NUMBER}/" "$pb"
          done
          grep -H '^pkgrel=' packages/*/PKGBUILD

      - name: Build ISOs in Arch container
        # mkarchiso needs CAP_SYS_ADMIN, loop devices, and the ability to
        # bind-mount inside chroots. The simplest path is a privileged Arch
        # container; running it via `docker run` (rather than the workflow's
        # `container:` keyword) lets us pass --privileged.
        #
        # Tag pushes (v*) get a *second* ISO build with linux-firmware
        # bundled — that's the "full" variant attached to the release for
        # bare-metal installs (WiFi, modern AMD/NVidia GPUs). Every other
        # push only gets the slim ISO.
        env:
          BUILD_FULL: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e BUILD_FULL \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            archlinux:latest bash -euo pipefail -c '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm
              # `grub` provides grub-install / grub-mkrescue, needed by the
              # uefi.grub bootmode. `erofs-utils` is normally pulled in by
              # archiso but pin it just in case the dep graph changes.
              pacman -S --noconfirm --needed \
                archiso grub erofs-utils base-devel sudo \
                python python-build python-installer python-setuptools python-wheel

              # makepkg refuses to run as root, so do the whole build as an
              # unprivileged user with passwordless sudo.
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chown -R builder:builder /work

              # Slim build. Always runs.
              sudo -u builder ./build.sh

              # Full build. Only on tag pushes. Reuses the local Arch repo
              # that the slim build already staged into the airootfs, so no
              # need to rebuild the gameos-* PKGBUILDs.
              if [[ "$BUILD_FULL" == "true" ]]; then
                sudo -u builder ./iso/build.sh full
              fi
            '

      - name: Upload slim ISO as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: gameos-slim
          path: iso/out/gameos-2*.iso
          if-no-files-found: error
          retention-days: 30

      - name: Upload staged pacman repo as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: gameos-repo
          path: iso/airootfs/var/cache/gameos-repo
          if-no-files-found: error
          retention-days: 7

      - name: Upload full ISO as workflow artifact (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: gameos-full
          path: iso/out/gameos-full-*.iso
          if-no-files-found: error
          retention-days: 30

      - name: Attach ISOs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            iso/out/gameos-*.iso
            iso/out/gameos-full-*.iso
          generate_release_notes: true

      # --- Publish the [gameos] pacman repo to GitHub Pages -------------
      # Served at https://tomribbens.github.io/FactoriOS/x86_64/. The
      # installer wires this as a [gameos] entry in /etc/pacman.conf so
      # `pacman -Syu` on an installed system picks up new package versions
      # alongside the rest of Arch. main pushes only — PRs and tags don't
      # republish.
      - name: Stage repo for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # The docker container chown'd the whole workspace to its
          # internal builder UID; reclaim it for the runner before we
          # try to mkdir anywhere.
          sudo chown -R "$USER":"$USER" .
          mkdir -p gh-pages-stage/x86_64
          src=iso/airootfs/var/cache/gameos-repo
          # Copy the package files as-is.
          cp "$src"/*.pkg.tar.zst gh-pages-stage/x86_64/
          # `repo-add` creates {gameos.db,gameos.files} as symlinks
          # to the corresponding .tar.zst — pacman requests them by the
          # short name. GitHub Pages doesn't reliably serve symlinks, so
          # materialize both names as regular files.
          for stem in gameos.db gameos.files; do
              cp "$src/$stem.tar.zst" "gh-pages-stage/x86_64/$stem.tar.zst"
              cp "$src/$stem.tar.zst" "gh-pages-stage/x86_64/$stem"
          done
          # Convenience landing page so a browser visit isn't a 404.
          cat > gh-pages-stage/index.html <<'EOF'
          <!doctype html><meta charset=utf-8><title>GameOS pacman repo</title>
          <h1>GameOS</h1>
          <p>This is the pacman repo for <a href="https://github.com/tomribbens/FactoriOS">GameOS</a>.</p>
          <p>Add to <code>/etc/pacman.conf</code>:</p>
          <pre>[gameos]
          SigLevel = Optional TrustAll
          Server = https://tomribbens.github.io/FactoriOS/$arch
          </pre>
          EOF

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-stage

  pages:
    # GitHub Pages requires a dedicated job + environment.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  installer-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download staged pacman repo artifact
        uses: actions/download-artifact@v8
        with:
          name: gameos-repo
          path: iso/airootfs/var/cache/gameos-repo

      - name: Validate keyring refresh and pacstrap path
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$GITHUB_WORKSPACE/iso/airootfs/var/cache/gameos-repo":/var/cache/gameos-repo:ro \
            archlinux:latest bash -euo pipefail -c '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed arch-install-scripts

              rm -rf /etc/pacman.d/gnupg
              pacman-key --init
              pacman-key --populate archlinux

              # This mirrors the live ISO fix: a stale keyring must be
              # refreshable before pacstrap touches signed packages.
              pacman -Sy --noconfirm archlinux-keyring

              install -d /tmp/gameos-root
              pacstrap -C /work/iso/airootfs/etc/pacman.conf -K /tmp/gameos-root \
                base linux archlinux-keyring \
                gameos-launcher gameos-greeter gameos-base
            '
