[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameos-greeter"
version = "0.1.0"
description = "GTK4 game-appliance kiosk greeter for GameOS"
requires-python = ">=3.11"
dependencies = [
    "gameos-launcher",
    "PyGObject>=3.46",
]

[project.scripts]
gameos-greeter = "gameos_greeter.app:main"
factorios-greeter = "factorios_greeter.app:main"

[tool.setuptools.packages.find]
include = ["factorios_greeter*", "gameos_greeter*"]
