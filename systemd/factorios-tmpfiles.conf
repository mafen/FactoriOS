# Ensure /var/lib/gameos and its subtree are owned by the gameos
# user on every boot. gameos-launcher's PKGBUILD ships these as
# root-owned (it has to — PKGBUILD package() runs as fakeroot before any
# user exists), and gameos-base.install chowns them post-install, but
# anything that resets ownership (manual chown, partial reinstall) is
# self-healed by systemd-tmpfiles-setup.service early in boot.
#
# Format: type path mode user group age argument
d /var/lib/gameos          0755 gameos gameos - -
d /var/lib/gameos/versions 0755 gameos gameos - -
d /var/lib/gameos/users    0755 gameos gameos - -
d /var/lib/gameos/providers 0755 gameos gameos - -
# Home dir for the gameos user. sysusers.d declares the path but
# doesn't create it; profiles._link_home_factorio() symlinks
# ~/.factorio in here before launch, so the dir must exist.
d /home/gameos             0700 gameos gameos - -
