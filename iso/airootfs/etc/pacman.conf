# pacman.conf for the GameOS *live env* (and therefore for the installer's
# pacstrap, which reuses this config). The [gameos] repo points at the
# package cache that the build script stages into the airootfs.
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[gameos]
SigLevel = Optional TrustAll
Server = file:///var/cache/gameos-repo
