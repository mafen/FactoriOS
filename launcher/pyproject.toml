[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameos-launcher"
version = "0.1.0"
description = "Shared game-appliance launcher library for GameOS"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
gameos-launcher = "gameos_launcher.__main__:main"
factorios-launcher = "factorios_launcher.__main__:main"

[tool.setuptools.packages.find]
include = ["factorios_launcher*", "gameos_launcher*"]
